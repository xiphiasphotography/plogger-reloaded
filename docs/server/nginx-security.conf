# Include inside the gallery server {} BEFORE generic regex PHP/static locations.
# Assumes installation at /. Prefix URI patterns for a subdirectory installation.
# Keep the existing document root and the actual PHP-FPM socket configured by Plesk.
autoindex off;
location ~ (^|/)\. { return 404; }
location ~* ^/(?:vendor|tests|tools|docs|backups)(?:/|$) { return 404; }
location ~* ^/(?:plog-config[^/]*|composer\.(?:json|lock)|phpunit[^/]*|phpstan[^/]*)$ { return 404; }
location ~* \.(?:sql|log|ini|neon|bak|old|orig|swp)(?:\.|$) { return 404; }
location ^~ /plog-content/uploads/ { return 404; }
location ^~ /plog-includes/lib/ { return 404; }
location ~ ^/plog-includes/(?!plog-captcha\.php$) { return 404; }
location ^~ /plog-admin/includes/ { return 404; }
location ^~ /plog-admin/migrations/ { return 404; }
location ~* ^/plog-content/.*\.(?:php[0-9]*|phtml|phar|cgi|pl|py|sh|shtml)(?:[./]|$) { return 404; }
# Keep denied normally. Restricted staging web upgrades need a temporary,
# reviewed exception plus PLOGGER_ENABLE_UPGRADE_WEB=true; see UPGRADING.md.
location ~ ^/plog-admin/_(?:install|upgrade)\.php$ { return 404; }

