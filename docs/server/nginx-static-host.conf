# Dedicated static host: no fastcgi_pass, proxy_pass or PHP handler anywhere.
# Adjust hostname, TLS configuration and mirrored directory root before use.
server {
    listen 80;
    server_name static.example.invalid;
    root /var/www/plogger-static;
    autoindex off;
    add_header X-Content-Type-Options nosniff always;
    location ~ (^|/)\. { return 404; }
    location ~* \.(?:php[0-9]*|phtml|phar|cgi|pl|py|sh|shtml)(?:[./]|$) { return 404; }
    location ~* ^/plog-content/(?:images|thumbs|themes)/.+\.(?:jpe?g|png|gif|bmp|webp|avif|ico|css|js|svg|woff2?|ttf)$ {
        try_files $uri =404;
    }
    location / { return 404; }
}
