# Include ONLY inside a dedicated static server {}, not the application/PHP server.
# Replace this root with the separately published, public-only mirror.
root /srv/plogger-public;
autoindex off;
disable_symlinks on;
default_type application/octet-stream;

# This host has no PHP handler, FastCGI, proxy fallback or directory index.
if ($request_method !~ ^(GET|HEAD)$) { return 405; }
add_header X-Content-Type-Options nosniff always;
add_header Content-Security-Policy "default-src 'none'; sandbox" always;
# Public fonts/assets only. Never enable credentials on this static host.
add_header Access-Control-Allow-Origin "*" always;

# Regex order matters: deny hidden/script/private paths BEFORE static allowlists.
location ~ (^|/)\. { return 404; }
location ~* \.(?:php[0-9]*|phtml|phar|cgi|pl|py|sh|shtml)(?:[./]|$) { return 404; }
location ^~ /plog-content/uploads/ { return 404; }
location ^~ /plog-content/thumbs/uploads/ { return 404; }
location ~* ^/plog-content/(?:images|thumbs)/.+\.(?:jpe?g|png|gif|bmp|webp|avif)$ {
    try_files $uri =404;
    expires 1h;
}
location ~* ^/plog-content/themes/[^/]+/.+\.(?:css|js|mjs|jpe?g|png|gif|bmp|webp|avif|svg|ico|woff2?|ttf|otf|eot)$ {
    try_files $uri =404;
    expires 1h;
}
location / { return 404; }
