# Apache 2.4 virtual-host example. Replace /var/www/plogger with the actual root.
# Review alongside the host's PHP-FPM configuration; do not paste into Plesk blindly.
<Directory "/var/www/plogger">
    Options -Indexes -MultiViews
    AllowOverride None
    AcceptPathInfo Off
    <FilesMatch "(?i)^(?:plog-config.*|composer\.(?:json|lock)|phpunit.*|phpstan.*|.*\.(?:sql|log|ini|neon|bak|old|orig|swp))$">
        Require all denied
    </FilesMatch>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>
</Directory>
<DirectoryMatch "^/var/www/plogger/(?:vendor|tests|tools|docs|backups|\.git|\.github)(?:/|$)">
    Require all denied
</DirectoryMatch>
<Directory "/var/www/plogger/plog-content">
    Options -Indexes -ExecCGI -Includes -MultiViews
    AllowOverride None
    AcceptPathInfo Off
    <FilesMatch "(?i)\.(?:php[0-9]*|phtml|phar|cgi|pl|py|sh|shtml)(?:[./]|$)">
        Require all denied
    </FilesMatch>
</Directory>
<Directory "/var/www/plogger/plog-content/uploads">
    Require all denied
</Directory>
<Directory "/var/www/plogger/plog-includes/lib">
    Require all denied
</Directory>
<Directory "/var/www/plogger/plog-includes">
    Require all denied
    <Files "plog-captcha.php">
        Require all granted
    </Files>
</Directory>
<Directory "/var/www/plogger/plog-admin/includes">
    Require all denied
</Directory>
<Directory "/var/www/plogger/plog-admin/migrations">
    Require all denied
</Directory>
# Keep denied normally. Restricted staging web upgrades require a temporary,
# reviewed exception plus PLOGGER_ENABLE_UPGRADE_WEB=true; see UPGRADING.md.
<LocationMatch "^/plog-admin/_(?:install|upgrade)\.php$">
    Require all denied
</LocationMatch>
